name: CI Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run app
        run: node api.js > server.log 2>&1 &

      - name: Wait for server
        run: sleep 5

      - name: Check server logs
        if: always()
        run: cat server.log

      - name: Verify server is running
        run: |
          if ! pgrep -f "node api.js" > /dev/null; then
            echo "Server failed to start"
            exit 1
          fi

      - name: Test API
        run: curl -f http://localhost:3000
        
      - name: Stop server
        run: pkill node
